llm:
  provider: openrouter  # openrouter, openai, gemini
  model: openai/gpt-4o-mini
  temperature: 0.7
  max_tokens: 4096
  timeout: 30
  retry_attempts: 3
  retry_delay: 2.0

openrouter:
  base_url: https://openrouter.ai/api/v1

openai:
  base_url: https://api.openai.com/v1

gemini:
  base_url: https://generativelanguage.googleapis.com/v1beta

sarvam:
  # API key: use SARVAM_API_KEY env var only — never hardcode here
  stt_model: "saaras:v3"                 # STT model: sarvam-1
  tts_model: "bulbul:v3"                 # TTS model: bulbul:v3 (or bulbul:v2)
  stt_language_code: "hi-IN"          # language code for STT (Hinglish/Hindi input)
  stt_with_translation: true          # transcribe Hinglish audio, output English text
  tts_language_code: "hi-IN"          # language code for TTS
  tts_speaker: ishita                 # fallback TTS speaker (personality voices override this)
  tts_pitch: 0.0
  tts_pace: 1.0
  tts_loudness: 1.0
  tts_sample_rate: 22050

voice:
  provider:   sarvam                 # overall voice provider (whisper, sarvam)
  stt_provider: sarvam               # whisper or sarvam
  tts_provider: sarvam                 # piper or sarvam
  silence_duration: 1.0            # seconds of quiet after speech before processing
  listen_timeout: 15.0             # max seconds to wait for you to start speaking

personality:
  active: JARVIS

conversation:
  max_history: 50
  max_context_tokens: 8192
  autosave: true
  autosave_interval: 60

stt:
  model_size: base        # tiny, base, small, medium, large-v3
  device: auto            # auto, cpu, cuda
  compute_type: auto      # auto, float16, int8_float16
  language: ""            # auto-detect if empty
  vad_threshold: 0.3
  min_speech_duration: 0.3

tts:
  voice_dir: ""           # path to voice model files
  default_voice: en_US-lessac-medium
  sample_rate: 22050

memory:
  db_path: memory.db
  vector_db_path: vector_memory
  auto_extract: true
  auto_extract_interval: 300  # seconds between extractions
  max_facts_in_context: 20

tool:
  enabled: true
  max_tool_rounds: 5
  permissions:
    execute_command:
      level: confirm
    close_app:
      level: confirm
    open_file:
      level: auto
    search_google:
      level: auto
    search_youtube:
      level: auto

services:
  enabled: true
  email:
    # API keys never here. Use env vars: EMAIL_USERNAME, EMAIL_PASSWORD,
    # EMAIL_IMAP_HOST, EMAIL_SMTP_HOST, EMAIL_FROM (app password recommended).
    imap_host: ""          # e.g. imap.gmail.com
    imap_port: 993
    smtp_host: ""          # e.g. smtp.gmail.com
    smtp_port: 587
    use_ssl: true
    username: ""
    password: ""
    from_address: ""
  calendar:
    provider: local       # local or google
    db_path: calendar.db
    # For Google Calendar, set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET /
    # GOOGLE_REFRESH_TOKEN / GOOGLE_CALENDAR_ID env vars.
    google_client_id: ""
    google_client_secret: ""
    google_refresh_token: ""
    google_calendar_id: primary
    reminders_enabled: true
  calling:
    provider: local       # local or twilio (set TWILIO_* env vars)
    db_path: calls.db
    twilio_account_sid: ""
    twilio_auth_token: ""
    twilio_from_number: ""
  notes:
    db_path: notes.db
  telegram:
    # MTProto userbot (Telethon). Keys via env: TELEGRAM_API_ID, TELEGRAM_API_HASH,
    # TELEGRAM_SESSION_NAME, TELEGRAM_ALLOWED_USERS, TELEGRAM_OWNER_CHAT_ID.
    enabled: false
    api_id: 0
    api_hash: ""
    session_name: jarvis_telegram
    allowed_users: []
    owner_chat_id: 0
    voice_enabled: true
  external:
    # Optional keys via env: WEATHER_API_KEY, NEWS_API_KEY
    weather_api_key: ""
    news_api_key: ""
    default_city: ""

logging:
  level: info
  format: console  # console or json
